name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: python3 .agent-checks/bin/agent-checks no-skips -- pytest -q -rs

  alert:
    name: Open an issue when the nightly run fails
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [pytest]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - run: python3 .agent-checks/bin/agent-checks nightly-alert "${{ contains(needs.*.result, 'failure') && 'fail' || 'ok' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
